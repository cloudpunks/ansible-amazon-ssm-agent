#:schema https://mise.jdx.dev/schema/mise.json

[tools]
node = "24"
pre-commit = "4.6.2"
python = "3.14.8"
uv = "0.12.23"

"pipx:ansible-doctor" = { version= "8.4.3", uvx_args = "--with ansible-core" }
"pipx:ansible-lint" = "26.9.0"

"pipx:ansible-core" = { version = "2.21.5", uvx_args = "--with docker --with requests" }
"pipx:molecule" = { version = "26.9.0", uvx_args = "--with molecule-plugins[docker] --with pytest --with pytest-testinfra --with-executables-from pytest" }
