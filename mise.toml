#:schema https://mise.jdx.dev/schema/mise.json

[tools]
node = "24"
pipx = "1.16.7"
pre-commit = "4.6.2"
python = "3.14.7"

"pipx:ansible-doctor" = { version= "8.4.0", uvx_args = "--with ansible-core" }
"pipx:ansible-lint" = "26.8.0"

"pipx:ansible-core" = { version = "2.21.3", uvx_args = "--with docker --with requests" }
"pipx:molecule" = { version = "26.8.0", uvx_args = "--with molecule-plugins[docker] --with pytest --with pytest-testinfra --with-executables-from pytest" }
